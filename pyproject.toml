[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "martial-arts-ai"
version = "0.1.0"
description = "Computer Vision & Biomechanical Movement Analyzer for Martial Arts (Karate Katas & Strikes)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Martial Arts AI Team"}
]
dependencies = [
    "mediapipe>=0.10.14",
    "opencv-python>=4.9.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "matplotlib>=3.8.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "black>=24.0.0",
    "flake8>=7.0.0"
]

[project.scripts]
martial-arts-ai = "martial_arts_ai.cli:main"

